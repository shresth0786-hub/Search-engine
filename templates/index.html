<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClothiQ - Clothing Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="logo">ClothiQ <span>Clothing Search</span></div>
      <button id="exportBtn" class="btn ghost" title="Download current results as .txt">Export list</button>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <h1>Find Your Perfect Outfit</h1>
      <p class="hero-sub">Search men's, women's, and kids' clothing by style, fabric, or colour.</p>
      <div class="hero-search">
        <span class="search-icon">&#128269;</span>
        <input id="queryInput" type="text" placeholder='Search e.g. "black cotton t-shirt"'
               autocomplete="off">
        <button id="searchBtn" class="btn primary hero-btn">Search</button>
      </div>
      <div class="section-tabs" id="sectionTabs">
        <button data-section="MEN" class="sect active">Men</button>
        <button data-section="WOMEN" class="sect">Women</button>
        <button data-section="KIDS" class="sect">Kids</button>
      </div>
      <div id="toolMsg" class="tool-msg hidden"></div>
      <div id="correctionBar" class="correction-bar hidden"></div>
    </div>
  </section>

  <main class="container">
    <div id="resultsHeader" class="results-header hidden"></div>
    <div id="results" class="products-grid"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-emoji">&#128717;</div>
      <p>Search for an item above to see matching clothes.</p>
      <p class="empty-tip">Try: <em>black t-shirt</em>, <em>winter jacket</em>, <em>kotton saree</em>, <em>slim jeans</em></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      ClothiQ &middot; Clothing Information Retrieval System
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
